name: Public source verification

on:
  pull_request:
  push:
    branches: [main, 'review/**']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml
      - name: Clean dependency install
        run: pnpm install --frozen-lockfile
        working-directory: product
      - name: Source lint
        run: pnpm run lint
        working-directory: product
      - name: TypeScript
        run: pnpm run typecheck
        working-directory: product
      - name: Unit and UI-contract tests
        run: pnpm test
        working-directory: product
      - name: Production build
        run: pnpm run build
        working-directory: product
      - name: Dependency audit
        run: pnpm audit
        working-directory: product
      - name: Exact manifest and public-boundary verification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/verify_public_candidate.py
      - name: Secret scan
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/${archive}" \
            | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --no-banner --redact --exit-code 1
      - name: Generate verification SBOM
        uses: anchore/sbom-action@04151451f829cb881fd7b3250eccf4021433e14e
        with:
          path: product
          format: cyclonedx-json
          output-file: generated-review-sbom.cdx.json
          artifact-name: luma-ai-frontend-verification-sbom
          upload-release-assets: false
          dependency-snapshot: false

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
